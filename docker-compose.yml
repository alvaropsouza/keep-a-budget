version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: road-of-life-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: road_of_life
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d road_of_life"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - road-of-life-network

  minio:
    image: minio/minio:latest
    container_name: road-of-life-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - road-of-life-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  road-of-life-network:
    driver: bridge
